---
# tasks file for mariadb

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    owner: root
    group: root
    mode: "0755"

- name: Install MariaDB 10.11 GPG-keys
  ansible.builtin.get_url:
    url: https://mariadb.org/mariadb_release_signing_key.pgp
    dest: /etc/apt/keyrings/mariadb-keyring.pgp
    mode: "0744"

- name: Copy .sources file to sources.list.d (Ubuntu)
  ansible.builtin.copy:
    src: mariadb-ubuntu.sources
    dest: /etc/apt/sources.list.d/mariadb.sources
    owner: root
    group: root
    mode: "0744"
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Copy .sources file to sources.list.d (Debian)
  ansible.builtin.copy:
    src: mariadb-debian.sources
    dest: /etc/apt/sources.list.d/mariadb.sources
    owner: root
    group: root
    mode: "0744"
  when: ansible_facts['distribution'] == "Debian"

- name: Install MariaDB 10.11 dependencies
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    update_cache: true

- name: Ensure MariaDB started and enabled
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Create blog database
  community.mysql.mysql_db:
    name: blog
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create app user and grant privileges (As Root)
  community.mysql.mysql_user:
    name: "{{ blog_db_user }}"
    password: "{{ blog_db_password }}"
    priv: 'blog.*:ALL' # Full privileges on blog DB
    host: 'localhost'
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Copy database schema file
  ansible.builtin.copy:
    src: db.sql
    dest: /tmp/db-schema.sql
    mode: "0755"

- name: Check if database is already initialized
  community.mysql.mysql_query:
    login_user: "{{ blog_db_user }}"
    login_password: "{{ blog_db_password }}"
    login_db: blog
    login_unix_socket: /run/mysqld/mysqld.sock
    query: "SHOW TABLES LIKE 'posts';"
  register: mariadb_table_check

- name: Restore database schema
  community.mysql.mysql_db:
    name: blog
    state: import
    target: /tmp/db-schema.sql
    login_user: "{{ blog_db_user }}"
    login_password: "{{ blog_db_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  when: mariadb_table_check.rowcount == [0]
