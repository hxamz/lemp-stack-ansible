---
- name: Deploying LEMP-stack
  hosts: all
  become: true

  vars:
    project_root: "/var/www"
    project_name: "php-blog"

  pre_tasks:
    - name: Install ACL package
      ansible.builtin.apt:
        name: acl
        state: present

  roles:
    - git-clone
    - php
    - mariadb
    - nginx
